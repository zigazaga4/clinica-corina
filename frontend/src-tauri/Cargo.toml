[package]
name = "clinica-app"
version = "0.1.4"
description = "Aplicatie interna de gestiune a clientilor unei clinici"
authors = ["TZ INTELLIGENCE 28 SRL"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Salvarea acordurilor GDPR pe disc și deschiderea lor.
#
# Interfața trăiește într-o fereastră de browser, iar un browser nu are voie
# să scrie fișiere unde vrea. Acordul semnat se ia de pe server ca șir de
# octeți, deci cineva trebuie să-l așeze pe disc: `fs` scrie, `opener` îl
# deschide apoi în cititorul obișnuit de PDF. Amândouă sunt îngrădite din
# `capabilities/acorduri.json` la dosarul Documente — nicăieri altundeva.
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# Actualizarea automată există doar pe calculator. Pe telefon, magazinul de
# aplicații (sau instalarea manuală a APK-ului) face aceeași treabă, iar
# aceste două module nici măcar nu se compilează pentru Android sau iOS —
# de aceea sunt legate de sistemele de birou, nu puse la comun.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
